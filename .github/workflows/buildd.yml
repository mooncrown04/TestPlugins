name: Build cs

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: src

      - name: Checkout builds branch
        uses: actions/checkout@v4
        with:
          ref: builds
          path: builds

      - name: Clean old builds
        run: rm -f $GITHUB_WORKSPACE/builds/*.cs3

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Pre-approve Android Licenses
        run: |
          mkdir -p /usr/local/lib/android/sdk/licenses
          
          echo -e "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb74373072c23943e3d0\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n24333f8a63b6ad3651ccc727f8520331f38e0e06" > /usr/local/lib/android/sdk/licenses/android-sdk-license
          echo -e "33b6a2b64d8f170308c6887554f67d3e60f0891d" > /usr/local/lib/android/sdk/licenses/android-googletv-license
          echo -e "84831b9409646a918e30573bab4c9c91346d8abd\n5046632205423854d63234d67e7c65369656979a" > /usr/local/lib/android/sdk/licenses/android-sdk-preview-license

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
          accept-android-sdk-licenses: true

      - name: Finalize Android Licenses
        run: |
          mkdir -p $ANDROID_HOME/licenses
          
          echo -e "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb74373072c23943e3d0\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n24333f8a63b6ad3651ccc727f8520331f38e0e06" > $ANDROID_HOME/licenses/android-sdk-license
          echo -e "33b6a2b64d8f170308c6887554f67d3e60f0891d" > $ANDROID_HOME/licenses/android-googletv-license
          
          SDK_MANAGER=$(find $ANDROID_HOME -name sdkmanager | head -n 1)
          yes | $SDK_MANAGER --licenses || true

      - name: Fix local.properties for Linux runner
        run: |
          echo "sdk.dir=$ANDROID_HOME" > $GITHUB_WORKSPACE/src/local.properties

      - name: Build Project
        run: |
          cd src
          chmod +x gradlew
          ./gradlew clean build --stacktrace --no-daemon

      - name: Build Plugins
        run: |
          cd src
          ./gradlew make makePluginsJson --stacktrace --no-daemon
          find . -name "*.cs3" -exec cp {} $GITHUB_WORKSPACE/builds \;
          cp -f build/plugins.json $GITHUB_WORKSPACE/builds || echo "plugins.json bulunamadı"

          cd $GITHUB_WORKSPACE/builds
          if [ -f "plugins.json" ]; then
            sed -i '/"fileHash"/d' plugins.json
            
            echo 'import json
DESIRED_ORDER = ["iconUrl", "apiVersion", "repositoryUrl", "fileSize", "status", "language", "authors", "tvTypes", "version", "internalName", "description", "url", "name"]
try:
    with open("plugins.json", "r", encoding="utf-8") as f:
        data = json.load(f)
    ordered_data = []
    for item in data:
        ordered_item = {k: item[k] for k in DESIRED_ORDER if k in item}
        for k, v in item.items():
            if k not in ordered_item:
                ordered_item[k] = v
        ordered_data.append(ordered_item)
    with open("plugins.json", "w", encoding="utf-8") as f:
        json.dump(ordered_data, f, indent=4, ensure_ascii=False)
    print("plugins.json sıralaması başarıyla güncellendi.")
except Exception as e:
    print("Hata oluştu:", e)' > reorder.py

            python3 reorder.py
            rm -f reorder.py
          fi

      - name: Push builds
        run: |
          cd builds
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add .
          git commit -m "Build $GITHUB_SHA" || echo "No changes to commit"
          git push origin builds
